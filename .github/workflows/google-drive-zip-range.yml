name: Google Drive ZIP / ZIP64 range inventory

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - commands/google-drive-auth.grease
      - commands/google-drive-zip-inventory.grease
      - commands/zip-central-directory.c
      - tests/zip-central-directory.sh
      - tests/google-drive-zip-inventory.sh
      - .github/workflows/google-drive-zip-range.yml
      - .github/workflows/build-icky-helpers.yml
      - qualification/**
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - commands/google-drive-auth.grease
      - commands/google-drive-zip-inventory.grease
      - commands/zip-central-directory.c
      - tests/zip-central-directory.sh
      - tests/google-drive-zip-inventory.sh
      - .github/workflows/google-drive-zip-range.yml
      - .github/workflows/build-icky-helpers.yml
      - qualification/**

concurrency:
  group: google-drive-zip-range-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GREASE_SOURCE_REVISION: 8052868773077602266d80bf39aad6998e2da749

jobs:
  icky-helpers:
    uses: ./.github/workflows/build-icky-helpers.yml

  stage-1-local-zip-range:
    needs: icky-helpers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Retrieve actual ICK-built helper binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: icky-storage-helpers-${{ github.run_id }}
          path: _/test-bin

      - name: Exercise deterministic local ZIP and ZIP64 range fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat _/test-bin/consumer-commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum -c _/test-bin/source.sha256
          (cd _/test-bin && sha256sum -c binaries.sha256)
          chmod +x _/test-bin/zip-central-directory
          ZIP_CENTRAL_DIRECTORY="$PWD/_/test-bin/zip-central-directory" \
            sh tests/zip-central-directory.sh

      - name: State stage 1 evidence boundary
        shell: sh
        run: |
          printf '%s\n' \
            'PASS stage 1: deterministic local classic ZIP and sparse ZIP64 bounded-range parsing and rejection policy only; no Drive or Grease claim.'

  stage-2-fake-drive-grease:
    needs: icky-helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:2.7.18-buster@sha256:c934af72b8bd03b9804d5bde2569c320926e70392d708d113a2e71bcf98c8a20
    steps:
      - name: Check out cloud storage commands
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out exact Grease source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/oils
          ref: ${{ env.GREASE_SOURCE_REVISION }}
          path: grease-source
          persist-credentials: false

      - name: Retrieve actual ICK-built helper binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: icky-storage-helpers-${{ github.run_id }}
          path: _/test-bin

      - name: Build exact Grease development runtime and enable the qualified helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C grease-source rev-parse HEAD)" = "$GREASE_SOURCE_REVISION"
          mkdir -p _/test-bin
          test "$(cat _/test-bin/consumer-commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum -c _/test-bin/source.sha256
          (cd _/test-bin && sha256sum -c binaries.sha256)
          chmod +x _/test-bin/zip-central-directory
          (cd grease-source && build/py.sh minimal)
          grease-source/bin/osh -c 'x=hello; ⟦ -n "$x" ∧ ¬ "$x" = no ⟧ ∧ echo grease-runtime-ready'

      - name: Install pinned jq for the Grease contract
        shell: bash
        env:
          JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
          JQ_SHA256: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
        run: |
          set -euo pipefail
          python2 - <<'PY'
          import hashlib
          import os
          import urllib2

          url = os.environ['JQ_URL']
          expected = os.environ['JQ_SHA256']
          path = '_/test-bin/jq'
          data = urllib2.urlopen(url).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit('jq SHA-256 mismatch: %s' % actual)
          with open(path, 'wb') as output:
              output.write(data)
          PY
          chmod +x _/test-bin/jq
          test "$(_/test-bin/jq --version)" = jq-1.8.1

      - name: Exercise fake Drive Range transport through Grease
        shell: bash
        run: |
          set -euo pipefail
          PATH="$PWD/_/test-bin:$PATH" \
          GREASE="$PWD/grease-source/bin/osh" \
          ZIP_CENTRAL_DIRECTORY="$PWD/_/test-bin/zip-central-directory" \
          PYTHON_FOR_FIXTURE=python2 \
            sh tests/google-drive-zip-inventory.sh

      - name: State stage 2 evidence boundary
        shell: sh
        run: |
          printf '%s\n' \
            'PASS stage 2: exact pinned Grease with fake Drive bounded HTTP Range transport for classic ZIP and ZIP64; not authenticated Drive acceptance.'
